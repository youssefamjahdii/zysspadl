<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
            <feColorMatrix in="blur" type="matrix" values="
                0 0 0 0 0.55
                0 0 0 0 0.78
                0 0 0 0 0.25
                0 0 0 1 0" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <linearGradient id="glass-grad" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="white" stop-opacity="0.9" />
            <stop offset="1" stop-color="#E0E0E0" stop-opacity="0.6" />
        </linearGradient>
    </defs>
    
    <!-- Lightning Bolt -->
    <path d="M110 20 L60 110 H100 L90 180 L140 90 H100 L110 20 Z" 
          fill="url(#glass-grad)" 
          stroke="#8CC63F" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#neon-glow)"/>
</svg>
